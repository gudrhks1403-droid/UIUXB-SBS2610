<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex 문제 2 - 정답</title>
    <style>
        /* [문제 2 정답] */
        .container {
            display: flex;
            justify-content: center; /* 정답 1: 가로 방향 가운데 정렬 */
            align-items: center;     /* 정답 2: 세로 방향 가운데 정렬 */
        }

        /* ---------- 문제와 같은 기본 스타일 ---------- */
        .container {
            height: 300px;
            background: #dddddd;
        }
        .box {
            width: 100px;
            height: 100px;
            background: tomato;
            color: #fff;
            font-weight: bold;
            text-align: center;
            line-height: 100px;
        }
    </style>
</head>
<body>
    <h1>문제 2 정답</h1>
    <p>빨간 박스가 회색 영역의 정가운데에 놓였어요.</p>

    <div class="container">
        <div class="box">가운데!</div>
    </div>
</body>
</html>
