<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마켓컬리 와이어프레임</title>
    <!-- 구글심볼 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-banner">지금 가입하고 최대 1만 2천원 할인 쿠폰 받아가세요!</div>
    <div class="utility-menu">
        <div class="con utility-con">
            <nav>
                <ul>
                    <li class="signup-link">회원가입</li>
                    <li>로그인</li>
                    <li>고객센터</li>
                </ul>
            </nav>
        </div>
    </div>
    <div class="main-header">
        <div class="con m-header-con">
            <div class="brand">
                <img src="./image/logo/logo.svg" alt="로고">
                <div class="brand-tabs">
                    <div class="brand-tab active">마켓컬리</div>
                    <div class="brand-tab">뷰티컬리</div>
                </div>
            </div>
            <div class="search">검색어를 입력해주세요</div>
            <div id="actions" class="actions">
                <div class="ac-icon pin">
                    <span class="location material-symbols-outlined">location_on</span>
                </div>
                <div class="ac-icon wish">
                    <span class="favorite material-symbols-outlined">favorite</span>
                </div>
                <div class="ac-icon cart">
                    <span class="shopping material-symbols-outlined">shopping_cart</span>
                </div>
            </div>
        </div>
    </div>
    <main>
        <div class="banner">
            <img src="./image/banner/banner01.jpg" alt="푸드 브랜드 위크 최대 20% 쿠폰">
        </div>
    </main>
</body>
</html>
