<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bluebottlecoffee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="notice-bar">35,000원 이상 구매 시 무료 배송 (제주도 별도)</div>
    <header>
        <div class="con header-con">
            <div class="header-menu">
                <ul>
                    <li>쇼핑</li>
                    <li>베스트셀러</li>
                    <li>카페</li>
                    <li>블로그</li>
                </ul>
            </div>
            <div class="header-logo">
                <img src="./images/logo.svg" alt="블루보틀 커피">
            </div>
            <div class="header-icons">
                <img src="./images/icon-search.svg" alt="검색">
                <img src="./images/icon-account.svg" alt="계정">
                <img src="./images/icon-cart.svg" alt="카트">

            
            </div>
        </div>
    </header>
    <main>
        <img class="banner-img" src="./images/main-banner.jpg" alt="2026 홀리데이 컬렉션">
    </main>
    <footer>하단</footer>
</body>
</html>
